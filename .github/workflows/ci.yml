name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Run the full prepublish gate (a–e): tarball composition, tui.tsx
      # pragma regression check via the esbuild PROGRAMMATIC API, resolve
      # chain, unit harness T1–T12 and the corporate-identifier scan.
      # Single source of truth, identical on Windows and Linux: the API
      # spawns the native esbuild binary with correct executable semantics
      # instead of `node <cli-bin>`, which breaks on Linux (ELF vs JS).
      - run: node test/prepublish.mjs