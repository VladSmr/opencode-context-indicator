name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily drift-watch: catch a host OpenTUI bump even without repo pushes
    # (opencode bumps OpenTUI every few releases; the pin must be re-aligned).
    # NOTE: GitHub auto-parks scheduled workflows after 60 days of repo
    # inactivity - a push or a manual workflow_dispatch re-enables them.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Typecheck the TUI entry (tui.ts + its lib/* imports, allowJs).
      # Kept out of prepublish.mjs: it needs the full devDependency tree.
      # --no-install: never fall back to fetching a random `tsc` package from
      # the registry; if typescript is missing, fail loudly instead.
      - run: npx --no-install tsc --noEmit

      # Typecheck the Desktop GUI part (gui/*.tsx, solid-js JSX, allowJs over
      # the plain-JS lib modules it imports).
      - run: npx --no-install tsc -p tsconfig.gui.json --noEmit

      # Build the Desktop GUI bundle BEFORE the gate: the gate inspects the
      # artifact that ships (dist/gui-experimental.cjs) and fails when it is
      # missing, so a build error must be the reported failure, not a missing
      # file. The bundle is a build output and is not committed.
      - run: npm run build:gui

      # Run the full prepublish gate (a)-(g): tarball composition (incl. the
      # built dist/ bundle), the JSX-free TUI + import-allowlist check via the
      # esbuild PROGRAMMATIC API, the resolve
      # chain (host-bridged + peer packages + the local lib import), the
      # unit harness T1-T36 (86 checks), the corporate-identifier scan and the
      # non-English (non-ASCII letter) scan, plus the Desktop GUI bundle check
      # (one CJS file, app-provided modules kept external).
      # Single source of truth, identical on Windows and Linux: the API
      # spawns the native esbuild binary with correct executable semantics
      # instead of `node <cli-bin>`, which breaks on Linux (ELF vs JS).
      - run: node test/prepublish.mjs

      # OpenTUI pin drift-watch (advisory by default): compare the pins with
      # the catalog of the latest RELEASED opencode (npm registry -> tag ->
      # catalog). Patch drift is reported as a warning and does NOT fail the
      # build; breaking drift still fails (a major bump, a minor bump of
      # @opencode/plugin, a 0.x @opentui minor bump, or a reshaped host
      # catalog). Run `node test/drift-watch.mjs --strict` before a release to
      # fail on ANY drift.
      - run: node test/drift-watch.mjs
